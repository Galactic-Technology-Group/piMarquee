# go2rtc static configuration for pimarquee.
# The `streams:` block is regenerated by the pimarquee server from the camera list;
# everything else here is yours to edit. Restart go2rtc after editing the static parts.
api:
  listen: ":1984"
  origin: "*"

webrtc:
  listen: ":8555"
  candidates:
    - stun:8555

# go2rtc's own RTSP server is not needed for signage.
rtsp:
  listen: ""

log:
  level: info

streams: {}
